<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSchedule-X | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div style="text-align: center; margin-bottom: 32px;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="var(--saffron)" style="margin-bottom: 16px;">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
                <h1 style="font-size: 28px; color: var(--saffron); margin-bottom: 4px;">XSchedule-X</h1>
                <p style="color: var(--text-muted); font-size: var(--font-small);">Programa tweets en horarios óptimos</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs" style="display: flex; gap: 8px; margin-bottom: 32px; background: var(--charcoal); padding: 4px; border-radius: var(--radius-sm);">
                <button
                    type="button"
                    class="auth-tab active"
                    data-tab="login"
                    style="flex: 1; padding: 10px; border: none; background: var(--surface); color: var(--text); border-radius: 6px; cursor: pointer; font-weight: 600; font-size: var(--font-small); transition: var(--transition);"
                >
                    Login
                </button>
                <button
                    type="button"
                    class="auth-tab"
                    data-tab="register"
                    style="flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); border-radius: 6px; cursor: pointer; font-weight: 600; font-size: var(--font-small); transition: var(--transition);"
                >
                    Registro
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="auth-header">
                    <h2>Inicia sesión</h2>
                    <p>Accede a tu cuenta para programar tweets</p>
                </div>

                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="tu@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                    Iniciar sesión
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form hidden">
                <div class="auth-header">
                    <h2>Crea tu cuenta</h2>
                    <p>Empieza a programar tus tweets hoy</p>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="tu@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="registerPassword">Contraseña</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Mínimo 6 caracteres"
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                </div>

                <div class="form-group">
                    <label for="registerPasswordConfirm">Confirmar contraseña</label>
                    <input
                        type="password"
                        id="registerPasswordConfirm"
                        placeholder="Repite tu contraseña"
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                    Crear cuenta
                </button>
            </form>

            <!-- Error message -->
            <div id="authError" class="hidden" style="margin-top: 16px; padding: 12px; background: rgba(229, 72, 77, 0.1); border: 1px solid var(--danger); border-radius: var(--radius-sm); color: var(--danger); font-size: var(--font-small);"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="auth.js"></script>
</body>
</html>
