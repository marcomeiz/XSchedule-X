<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSchedule-X | Programa tus publicaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
                <div>
                    <h1>XSchedule-X</h1>
                    <p class="tagline">Programa tweets en horarios óptimos</p>
                </div>
            </div>
            <div id="userInfo" class="user-info"></div>
        </header>

        <!-- Setup Section (Collapsible) -->
        <section id="setupSection" class="setup-section">
            <div class="setup-header" onclick="toggleSetup()">
                <h2>⚙️ Configuración</h2>
                <svg id="setupArrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>

            <div id="setupContent" class="setup-content">
                <form id="setupForm" class="setup-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="totalSlots">
                                <span class="label-icon">📊</span>
                                ¿Cuántos tweets?
                            </label>
                            <input type="number" id="totalSlots" min="1" max="50" value="10" required>
                        </div>

                        <div class="form-group">
                            <label for="timezone">
                                <span class="label-icon">🌍</span>
                                Zona horaria
                            </label>
                            <select id="timezone" required>
                                <option value="America/New_York">Nueva York (EST)</option>
                                <option value="America/Chicago">Chicago (CST)</option>
                                <option value="America/Denver">Denver (MST)</option>
                                <option value="America/Los_Angeles">Los Ángeles (PST)</option>
                                <option value="America/Mexico_City" selected>Ciudad de México (CST)</option>
                                <option value="America/Bogota">Bogotá (COT)</option>
                                <option value="America/Lima">Lima (PET)</option>
                                <option value="America/Argentina/Buenos_Aires">Buenos Aires (ART)</option>
                                <option value="America/Sao_Paulo">São Paulo (BRT)</option>
                                <option value="Europe/Madrid">Madrid (CET)</option>
                                <option value="Europe/London">Londres (GMT)</option>
                                <option value="UTC">UTC</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="workStart">
                                <span class="label-icon">🌅</span>
                                Hora inicio laboral
                            </label>
                            <input type="time" id="workStart" value="09:00" required>
                        </div>

                        <div class="form-group">
                            <label for="workEnd">
                                <span class="label-icon">🌆</span>
                                Hora fin laboral
                            </label>
                            <input type="time" id="workEnd" value="18:00" required>
                        </div>

                        <div class="form-group">
                            <label for="startDate">
                                <span class="label-icon">📅</span>
                                Inicio (opcional)
                            </label>
                            <input type="date" id="startDate">
                        </div>
                    </div>

                    <button type="submit" class="btn-calculate">
                        <span>✨ Calcular Timeline</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- Progress Section -->
        <section id="progressSection" class="progress-section hidden">
            <div class="progress-header">
                <div class="progress-stats">
                    <span class="progress-count">
                        <strong id="usedSlots">0</strong>/<span id="totalSlotsDisplay">10</span> slots
                    </span>
                    <span class="progress-percentage" id="progressPercentage">0%</span>
                </div>
                <button class="btn-reset" onclick="resetTimeline()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="1 4 1 10 7 10"></polyline>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                    </svg>
                    Reiniciar
                </button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </section>

        <!-- Main Input Section -->
        <section id="inputSection" class="input-section hidden">
            <div class="input-card">
                <div class="input-header">
                    <h3>✍️ Escribe tu publicación</h3>
                    <span class="next-slot-indicator" id="nextSlotIndicator"></span>
                </div>

                <form id="postForm" class="post-form">
                    <textarea
                        id="postContent"
                        placeholder="¿Qué quieres compartir?"
                        maxlength="280"
                        rows="4"
                        required
                    ></textarea>

                    <div class="input-footer">
                        <span class="char-counter">
                            <span id="charCount">0</span>/280
                        </span>
                        <button type="submit" class="btn-post" id="btnPost">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                            <span>Agregar al próximo slot</span>
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Timeline Section -->
        <section id="timelineSection" class="timeline-section hidden">
            <h2>🗓️ Timeline de publicaciones</h2>
            <div id="timeline" class="timeline"></div>
        </section>

        <!-- Empty State -->
        <section id="emptyState" class="empty-state">
            <div class="empty-state-content">
                <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <h3>¡Bienvenido!</h3>
                <p>Configura tu timeline para empezar a programar tweets en horarios óptimos</p>
                <button class="btn-start" onclick="toggleSetup()">
                    Comenzar →
                </button>
            </div>
        </section>
    </div>

    <!-- Confetti Canvas -->
    <canvas id="confetti"></canvas>

    <!-- Toast Notifications -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
