<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSchedule-X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Setup -->
        <div id="setupView" class="view setup-view">
            <div class="brand">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
                <h1>XSchedule-X</h1>
            </div>

            <form id="setupForm" class="setup-form">
                <div class="input-group">
                    <label>Cuántas publicaciones quieres programar?</label>
                    <input type="number" id="totalSlots" min="1" max="100" value="12" required>
                </div>

                <div class="input-group">
                    <label>Intervalo entre publicaciones (horas)</label>
                    <input type="number" id="intervalHours" min="0.5" max="24" step="0.5" value="2" required>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Horario laboral</label>
                        <div class="time-inputs">
                            <input type="time" id="workStart" value="09:00" required>
                            <span>—</span>
                            <input type="time" id="workEnd" value="18:00" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Zona horaria</label>
                        <select id="timezone" required>
                            <option value="America/Mexico_City" selected>CDMX</option>
                            <option value="America/New_York">NYC</option>
                            <option value="America/Los_Angeles">LA</option>
                            <option value="Europe/Madrid">Madrid</option>
                            <option value="Europe/London">London</option>
                            <option value="UTC">UTC</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    Generar timeline
                </button>
            </form>
        </div>

        <!-- Timeline View -->
        <div id="timelineView" class="view timeline-view hidden">
            <header class="header">
                <div class="header-left">
                    <h2>Timeline</h2>
                    <div class="progress-indicator">
                        <span id="progressText">0/12</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn-secondary" onclick="shuffleQueue()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 3 21 3 21 8"></polyline>
                            <line x1="4" y1="20" x2="21" y2="3"></line>
                            <polyline points="21 16 21 21 16 21"></polyline>
                            <line x1="15" y1="15" x2="21" y2="21"></line>
                            <line x1="4" y1="4" x2="9" y2="9"></line>
                        </svg>
                        Shuffle
                    </button>
                    <button class="btn-secondary" onclick="resetApp()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="1 4 1 10 7 10"></polyline>
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                        </svg>
                        Nueva timeline
                    </button>
                </div>
            </header>

            <!-- Write Section -->
            <section class="write-section">
                <form id="postForm" class="post-form">
                    <div class="textarea-wrapper">
                        <textarea
                            id="postContent"
                            placeholder="Escribe tu publicación..."
                            maxlength="280"
                            rows="4"
                            required
                        ></textarea>
                        <div class="textarea-footer">
                            <span class="char-count" id="charCount">0 / 280</span>
                            <button type="submit" class="btn-post">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                                Agregar
                            </button>
                        </div>
                    </div>
                </form>
            </section>

            <!-- Slots Grid -->
            <section class="slots-section">
                <div id="slotsGrid" class="slots-grid"></div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
