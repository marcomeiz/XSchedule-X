# fly.toml app configuration file for Judge Enhanced Server
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xschedule-x-judge'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  JUDGE_APP = 'true'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = 'tcp'
  internal_port = 3001
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
